spring.application.name=api
spring:
  cloud:
    gateway:
      routes:
        # AI Servisi (Python)
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1

        # Auth Servisi (Java)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # Project Servisi (Java)
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/projects/**
          filters:
            - StripPrefix=1