spring:
  application:
    name: product-service
  profiles:
    default: local
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

server:
  port: 8082

logging:
  level:
    root: INFO
    com.berkay: DEBUG
