spring:
  application:
    name: auth-service
  profiles:
    default: local
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB

server:
  port: 8081
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.berkay: DEBUG
